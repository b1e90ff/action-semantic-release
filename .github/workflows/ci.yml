name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-action:
    name: Action Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mpalmer/action-validator@main
        with:
          version: 0.6.0

  lint-scripts:
    name: Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts

  lint-workflows:
    name: Workflow Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2
        with:
          flags: "-verbose"

  lint-js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: |
          npm install --no-save eslint @eslint/js globals
          npx eslint .

  test-release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Notes render with the configured sections
        run: |
          set -euo pipefail
          # The spec release.sh installs, so a bad bump fails here first.
          spec=$(grep -oE 'conventional-changelog-conventionalcommits@[^"]+' scripts/release.sh)
          npm install --no-save --loglevel error @semantic-release/release-notes-generator "${spec}"
          node --test "test/*.test.mjs"

      - name: Preset guard accepts the pinned preset and rejects an old one
        run: |
          set -euo pipefail
          spec=$(grep -oE 'conventional-changelog-conventionalcommits@[^"]+' scripts/release.sh)
          pinned=$(mktemp -d)
          npm install --prefix "${pinned}" --no-save --loglevel error \
            @semantic-release/release-notes-generator "${spec}"
          node scripts/verify-preset.mjs "${pinned}"

          outdated=$(mktemp -d)
          npm install --prefix "${outdated}" --no-save --loglevel error \
            @semantic-release/release-notes-generator conventional-changelog-conventionalcommits@4.6.3
          if node scripts/verify-preset.mjs "${outdated}"; then
            echo "::error::the guard accepted a preset that drops every section"
            exit 1
          fi

  ci:
    name: CI
    needs: [lint-action, lint-scripts, lint-workflows, lint-js, test-release-notes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for result in "${{ needs.lint-action.result }}" "${{ needs.lint-scripts.result }}" "${{ needs.lint-workflows.result }}" "${{ needs.lint-js.result }}" "${{ needs.test-release-notes.result }}"; do
            [ "$result" = "success" ] || exit 1
          done
